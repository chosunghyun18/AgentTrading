# 복사해서 .streamlit/secrets.toml 로 쓴다(커밋 금지 — .gitignore 에 있음).
# AT_AUTH_REQUIRED=1 일 때 Streamlit 의 st.login(OIDC)이 읽는다. 의존성: uv sync --extra auth (streamlit[auth] = Authlib + httpx)
# 허용 계정은 환경변수 AT_AUTH_ALLOWED_EMAILS(쉼표 구분)로 따로 정한다 — 로그인만으로는 아무도 들어오지 못한다.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"   # 배포 주소로 바꾼다: https://<도메인>/oauth2callback
# cookie_secret 은 로그인 쿠키의 서명 키다. 비워 두면 앱이 "설정 필요"로 막힌다(32자 미만도 거부).
# 반드시 직접 만든 값을 넣는다:  python -c "import secrets; print(secrets.token_hex(32))"
cookie_secret = ""
client_id = ""
client_secret = ""
# 예: Google. 다른 OIDC 제공자는 그 제공자의 .well-known 주소를 쓴다.
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
