dataframeBorderColor = "#27272a"
baseRadius = "0.375rem"
showSidebarBorder = true
font = "sans-serif"
codeFont = "monospace"
redColor = "#ef5350"
greenColor = "#12bb7b"
orangeColor = "#f59e0b"
blueColor = "#3b82f6"
grayColor = "#71717a"
chartCategoricalColors = ["#38bdf8", "#a78bfa", "#f472b6", "#2dd4bf"]

[theme.sidebar]
backgroundColor = "#18181b"
textColor = "#a1a1aa"
primaryColor = "#3b82f6"
