# AgentTrading 콘솔 — 로컬 전용(127.0.0.1). 테마 값은 src/ui/theme.py 토큰 v2 와 같아야 한다(tests/test_ui_theme.py).
# 근거: Obsidian design/ui-ux-v2-benchmark.md (오픈소스 트레이딩 UI 벤치마크 — 다크 기본, 손익 색 FreqUI, 중립 zinc)
[server]
address = "127.0.0.1"
port = 8501
headless = true

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#09090b"
secondaryBackgroundColor = "#18181b"
textColor = "#f4f4f5"
linkColor = "#3b82f6"
